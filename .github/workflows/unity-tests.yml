name: Unity tests (manual)

# Runs the EditMode tests in the Unity Test Runner (Assets/_Main/Tests).
# Needs a Unity licence: add the repository secrets UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD
# (see https://game.ci/docs/github/activation) and start the workflow from the "Actions" tab.
on:
  workflow_dispatch:

jobs:
  edit-mode-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-

      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 2021.3.5f1
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
